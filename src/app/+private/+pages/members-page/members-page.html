<my-crud
  [myaction]="action"
  (onAdd)="add()"
  (onCancel)="cancel()"
  [columns]="columns"
  [data]="data"
  (onEdit)="edit($event)"
  (onRemove)="remove($event)"
  (onSave)="save()"
>  
<div>
    <input
      [disabled]="action == 'edit' || action == 'remove'"
      [(ngModel)]="item.id"
      type="number"
      id="id"
      name="id"
      placeholder="شناسه عضویت"
    />
  </div>
  <div>
    <input
      [disabled]="action == 'remove'"
      [(ngModel)]="item.fullName"
      type="text"
      id="fullName"
      name="fullName"
      placeholder="نام و نام خانوادگی"
    />
  </div>
  <div>
    <input
      [disabled]="action == 'remove'"
      [(ngModel)]="item.address"
      type="text"
      id="address"
      name="address"
      placeholder="آدرس"
    />
  </div>
  <div>
    <input
      [disabled]="action == 'remove'"
      [(ngModel)]="item.mobile"
      type="text"
      id="mobile"
      name="mobile"
      placeholder="موبایل"
    />
  </div>
</my-crud>
