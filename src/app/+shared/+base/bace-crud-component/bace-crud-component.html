@if(myaction=='list'){
<div>
  <button class="add" (click)="onAdd.emit()">افزودن</button>
</div>
<table>
  <thead>
    <tr>
      @for(col of columns;track $index){
        <th>{{col.title}}</th>
      }
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for(i of data;track $index){
    <tr>
      @for(col of columns;track $index){
      <td>{{ i[col.field] }}</td>
      }
      <td>
        <button class="edit" (click)="onEdit.emit(i)">ویرایش</button>
        <button class="remove" (click)="onRemove.emit(i)">حذف</button>
      </td>
    </tr>
    }
  </tbody>
</table>
} @else{ @if(myaction=='remove'){
<div class="alert">آیا از حذف این عضو اطمینان دارید؟</div>
}
<form (ngSubmit)="(onSave.emit)">
  <ng-content></ng-content>
  <div>
    <button class="primary" (click)="onSave.emit()" type="submit">تایید</button>
    <button (click)="onCancel.emit()" type="button">انصراف</button>
  </div>
</form>
}
